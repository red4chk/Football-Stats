[project]
name = "football-stats"
version = "0.1.0"
description = "Football data pipeline: API-Football -> MongoDB -> Dagster -> Metabase"
requires-python = ">=3.11"
dependencies = [
    "requests==2.32.3",
    "pymongo==4.9.2",
    "pandas==2.2.3",
    "dagster==1.9.3",
    "dagster-webserver==1.9.3",
    "python-dotenv==1.0.1",
    "urllib3==2.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-mock==3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast, fully isolated tests",
    "integration: tests that touch external services (MongoDB, Dagster)",
]

[tool.dagster]
module_name = "pipelines.definitions"
working_directory = "."
