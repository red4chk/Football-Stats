[project]
name = "football-stats"
version = "0.1.0"
description = "Football data pipeline: API-Football -> MongoDB -> Dagster -> Metabase"
requires-python = ">=3.11"
dependencies = [
    "requests==2.32.3",
    "pymongo==4.9.2",
    "pandas==2.2.3",
    "dagster==1.9.3",
    "dagster-webserver==1.9.3",
    "python-dotenv==1.0.1",
    "urllib3==2.2.3",
]

[tool.dagster]
module_name = "pipelines.definitions"
working_directory = "."
